# Ingress reverse proxy in front of Technitium's own web console.
#
# Why this exists: Technitium's web console sends `X-Frame-Options: DENY`
# and a Content-Security-Policy with `frame-ancestors 'none'`. Home
# Assistant's Ingress embeds every app's UI in an iframe on the same origin
# as the HA frontend; a page that refuses all framing makes the browser
# refuse to render it there at all (Chrome reports this as the page
# "refused to connect", which looks like a network failure but is a framing
# policy rejection). Confirmed against a live install on 2026-09-15: curling
# Technitium directly on its own loopback port returned a normal 200, so the
# console itself was never broken; only framing it was. See
# docs/decisions.md, "Ingress panel blocked by Technitium's own
# frame-blocking headers", for how this was found (compared against
# staerk-ha-addons/addon-technitium-dns, which solves the same problem the
# same way).
#
# nginx listens on 5380 (this app's declared `ingress_port`) and proxies to
# Technitium on 127.0.0.1:5381 (loopback only, not declared in config.yaml
# `ports:`, never reachable from outside this container). It replaces
# Technitium's frame-blocking headers with same-origin-only framing, which
# lets Ingress embed the console while still blocking cross-origin
# clickjacking -- it does not remove frame protection outright.

# No `user` directive: this container already runs entirely as root (see
# docs/security.md, "Container user"), so nginx's worker processes run as
# root too rather than dropping to a dedicated user. This does not change
# this app's existing trust boundary; it is called out here rather than
# left implicit.
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    # Web console access log, for the SOC audit trail Sean asked for. Ingress
    # requests all arrive from Home Assistant's own Ingress gateway
    # (apps-cards-hacs.md section 1.12), so $remote_addr here is always that
    # gateway's address, not the browser's -- the useful identity is the
    # X-Remote-User-Id/-Name/-Display-Name headers Ingress adds after
    # authenticating the viewer as a specific Home Assistant user (same
    # section). JSON lines, one request per line, so this is machine-parsable
    # without a custom log-format grammar. Rotated by run.sh/logrotate; see
    # docs/operations.md, "Web console access log for SOC audit tracking".
    # This is unverified against any specific downstream ingestion: how (or
    # whether) ha_Int_soc consumes this file is not something this app wires
    # up or assumes -- see docs/decisions.md.
    log_format ingress_access escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"user_id":"$http_x_remote_user_id",'
        '"user_name":"$http_x_remote_user_name",'
        '"user_display_name":"$http_x_remote_user_display_name",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"user_agent":"$http_user_agent"'
        '}';
    access_log /data/log/nginx/web_console_access.log ingress_access;

    # Technitium's web console uses a WebSocket for live dashboard updates;
    # forward the upgrade so that keeps working through the proxy.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 5380 default_server;
        server_name _;

        location / {
            proxy_pass http://127.0.0.1:5381;
            proxy_http_version 1.1;

            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'self';" always;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }
    }
}
