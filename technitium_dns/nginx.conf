# Reverse proxy in front of Technitium's own web console. Two listeners:
#
#   5380  Ingress-facing web console (this app's declared `ingress_port`).
#         Never mapped to a host port; only Home Assistant's Ingress gateway
#         reaches it, after authenticating the viewer as an HA user.
#   5382  Read-only monitoring API for Observe or similar tools. Declared
#         under `ports:` in config.yaml with `host: null` (off) by default;
#         the operator maps it (typically to host port 5380) to turn it on.
#         Proxies exactly three read-only API paths and answers 403 for
#         everything else. Technitium still authenticates every call with
#         its own user token. Added 2026-10-10; see docs/decisions.md,
#         "Read-only monitoring API on a second listener", and
#         docs/operations.md, "Monitoring API port for Observe or other
#         tools".
#
# Why the 5380 listener exists: Technitium's web console sends
# `X-Frame-Options: DENY` and a Content-Security-Policy with
# `frame-ancestors 'none'`. Home Assistant's Ingress embeds every app's UI
# in an iframe on the same origin as the HA frontend; a page that refuses
# all framing makes the browser refuse to render it there at all (Chrome
# reports this as the page "refused to connect", which looks like a network
# failure but is a framing policy rejection). Confirmed against a live
# install on 2026-09-15: curling Technitium directly on its own loopback
# port returned a normal 200, so the console itself was never broken; only
# framing it was. See docs/decisions.md, "Ingress panel blocked by
# Technitium's own frame-blocking headers", for how this was found
# (compared against staerk-ha-addons/addon-technitium-dns, which solves the
# same problem the same way).
#
# Both listeners proxy to Technitium on 127.0.0.1:5381 (loopback only, not
# declared in config.yaml `ports:`, never reachable from outside this
# container). The 5380 block replaces Technitium's frame-blocking headers
# with same-origin-only framing, which lets Ingress embed the console while
# still blocking cross-origin clickjacking -- it does not remove frame
# protection outright.

# No `user` directive: this container already runs entirely as root (see
# docs/security.md, "Container user"), so nginx's worker processes run as
# root too rather than dropping to a dedicated user. This does not change
# this app's existing trust boundary; it is called out here rather than
# left implicit.
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    # Web console access log, for the SOC audit trail Sean asked for. Both
    # listeners write to the same file with the same field set, so one
    # parser handles both; the `listener` field says which block wrote the
    # line. JSON lines, one request per line. Rotated by run.sh/logrotate;
    # see docs/operations.md, "Web console access log for SOC audit
    # tracking". This is unverified against any specific downstream
    # ingestion: how (or whether) ha_Int_soc consumes this file is not
    # something this app wires up or assumes -- see docs/decisions.md.
    #
    # Ingress lines: requests all arrive from Home Assistant's own Ingress
    # gateway (apps-cards-hacs.md section 1.12), so $remote_addr here is
    # always that gateway's address, not the browser's -- the useful
    # identity is the X-Remote-User-Id/-Name/-Display-Name headers Ingress
    # adds after authenticating the viewer as a specific Home Assistant
    # user (same section).
    log_format ingress_access escape=json
        '{'
        '"time":"$time_iso8601",'
        '"listener":"ingress",'
        '"remote_addr":"$remote_addr",'
        '"user_id":"$http_x_remote_user_id",'
        '"user_name":"$http_x_remote_user_name",'
        '"user_display_name":"$http_x_remote_user_display_name",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"user_agent":"$http_user_agent"'
        '}';

    # Monitoring API lines: the request comes straight from the LAN client
    # through Docker's port mapping, so $remote_addr is the real client
    # address and is the identity worth keeping. The user_* fields are
    # logged as empty literals on purpose rather than copied from request
    # headers: on this path nothing authenticates those headers, so a LAN
    # client could stamp any X-Remote-User-Name it liked into the audit
    # trail. `uri` is the normalized path plus the query string with any
    # `token=` or `pass=` value redacted (maps below), because Technitium
    # still accepts the legacy `?token=` form and a token must never land
    # in a log file that is kept for 90 days.
    log_format monitoring_access escape=json
        '{'
        '"time":"$time_iso8601",'
        '"listener":"monitoring_api",'
        '"remote_addr":"$remote_addr",'
        '"user_id":"",'
        '"user_name":"",'
        '"user_display_name":"",'
        '"method":"$request_method",'
        '"uri":"$uri$monitoring_query",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"user_agent":"$http_user_agent"'
        '}';
    access_log /data/log/nginx/web_console_access.log ingress_access;

    # Query-string redaction for the monitoring log: replace the value of a
    # `token=` and a `pass=` parameter (anywhere in the string) with
    # REDACTED, then prefix "?" only when something is left to log.
    map $args $monitoring_args_no_token {
        "~^(?<tpre>(?:.*&)?token=)[^&]*(?<tpost>.*)$" "${tpre}REDACTED${tpost}";
        default $args;
    }
    map $monitoring_args_no_token $monitoring_args {
        "~^(?<ppre>(?:.*&)?pass=)[^&]*(?<ppost>.*)$" "${ppre}REDACTED${ppost}";
        default $monitoring_args_no_token;
    }
    map $monitoring_args $monitoring_query {
        "" "";
        default "?$monitoring_args";
    }

    # Rate limit for the monitoring listener, keyed by client address. A
    # monitor polls once a minute (Observe's default interval is 60 s; its
    # fast re-check after a miss is every 10 s), so 2 requests/second with a
    # burst of 10 is far above legitimate use while keeping a leaked token
    # from hammering Technitium's API at line rate. Rejections answer 429.
    # Only requests that reach the proxied locations are counted: the
    # `return 403` fence below runs in an earlier nginx phase, costs no
    # backend work, and is not throttled.
    limit_req_zone $binary_remote_addr zone=monitoring_api:1m rate=2r/s;

    # Technitium's web console uses a WebSocket for live dashboard updates;
    # forward the upgrade so that keeps working through the proxy. Used by
    # the Ingress block only; the monitoring API is plain request/response.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # ---------------------------------------------------------- Ingress
    server {
        listen 5380 default_server;
        server_name _;

        location / {
            proxy_pass http://127.0.0.1:5381;
            proxy_http_version 1.1;

            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'self';" always;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }
    }

    # --------------------------------------------------- Monitoring API
    # Reachable from the LAN only once the operator maps 5382/tcp under
    # `ports:` in config.yaml (default host: null, off). Design, in order
    # of what a request meets:
    #
    #   1. Source address: only private, link-local, or loopback sources
    #      (RFC 1918, RFC 4193 ULA, RFC 4291 link-local). The real LAN
    #      client address is what arrives here through Docker's DNAT port
    #      mapping. A request from a public source address answers 403,
    #      so a port-forward from the internet to this host port would not
    #      expose the API even with a valid token. This is a labeled
    #      defense-in-depth control, not the primary boundary.
    #   2. Path: three exact-match locations are proxied; `location /`
    #      answers 403 for every other path, including /api/user/login,
    #      token creation, settings, zones, logs, and the console pages.
    #      The proxied path is written out literally in each proxy_pass
    #      rather than forwarded as the client sent it, so Technitium can
    #      only ever receive one of these three normalized paths; the
    #      query string is forwarded unchanged.
    #   3. Rate: limit_req above.
    #   4. Authentication: Technitium's own. The Authorization header and
    #      the query string pass through untouched; Technitium validates
    #      the token on every call and answers `"status":"invalid-token"`
    #      (HTTP 200) when it is wrong or expired. nginx holds no secret
    #      and performs no authentication of its own.
    #
    # No WebSocket upgrade headers, no frame-header rewriting: nothing
    # served here is a page.
    server {
        listen 5382;
        server_name _;
        server_tokens off;
        access_log /data/log/nginx/web_console_access.log monitoring_access;

        allow 127.0.0.0/8;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow ::1/128;
        allow fc00::/7;
        allow fe80::/10;
        deny all;

        limit_req zone=monitoring_api burst=10 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;

        # Shared by the three proxied locations below (inherited: none of
        # them sets its own proxy_set_header, so the whole set applies).
        # X-Real-IP is overwritten with the true client address, so
        # Technitium's own session and log entries show the LAN client,
        # not whatever a client put in that header itself (run.sh sets
        # DNS_SERVER_WEB_SERVICE_REVERSE_PROXY_ADDRESSES=127.0.0.1, which
        # is what makes Technitium read X-Real-IP from nginx).
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;

        # The fence. Everything not named below.
        location / {
            default_type text/plain;
            return 403 "403 Forbidden: not an allow-listed monitoring API path\n";
        }

        # Dashboard counters (Observe `mode: stats`). Technitium permission:
        # Dashboard: View. Parameters: type=LastHour|LastDay|..., utc=true.
        location = /api/dashboard/stats/get {
            proxy_pass http://127.0.0.1:5381/api/dashboard/stats/get$is_args$args;
        }

        # Update availability (Observe `mode: update`). Technitium
        # permission: none beyond a valid session. Technitium caches the
        # upstream answer for an hour, so polling this does not fan out to
        # Technitium's update server on every call.
        location = /api/user/checkForUpdate {
            proxy_pass http://127.0.0.1:5381/api/user/checkForUpdate$is_args$args;
        }

        # Token validity check: returns the session's own username and
        # permission table (and echoes the token the caller already holds),
        # nothing about any other user. Technitium permission: none beyond
        # a valid session. This is the one read-only call that separates
        # "token wrong" from "token valid but missing Dashboard: View" when
        # setting a monitor up. Observe does not call it.
        location = /api/user/session/get {
            proxy_pass http://127.0.0.1:5381/api/user/session/get$is_args$args;
        }
    }
}
