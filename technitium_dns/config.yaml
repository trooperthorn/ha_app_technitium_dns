name: "Technitium DNS Server"
description: "Full-featured, privacy-focused authoritative and recursive DNS server"
version: "2026.10.10.1"
slug: "technitium_dns"
init: false
startup: services
stage: stable
url: "https://github.com/trooperthorn/ha_app_technitium_dns/"

# Promoted from experimental to stable on 2026-09-15: Sean confirmed a real
# installation running as the household resolver, resolving DNS correctly.
# See docs/decisions.md.

arch:
  - aarch64
  - amd64

# No host_network. DNS on port 53 is the only thing that needs to leave the
# container, and an explicit ports: mapping does that without granting the
# host's whole network namespace (see docs/decisions.md, and section 1.10
# of apps-cards-hacs.md for the -1 host_network scoring this avoids).
# host: null means "let the installer choose the host port"; Sean's
# deployment maps it to 53 so LAN clients can resolve through it.
# 53/tcp and 53/udp are the standard DNS port and are mapped on by default so
# LAN clients need no special port configuration -- pointing a device's
# resolver at this host's address is enough, the same as any other DNS
# server. 853/443 are the standard ports for DNS-over-TLS, DNS-over-HTTPS,
# and DNS-over-QUIC (encrypted DNS that many current OS and browser
# resolvers use automatically when offered); they default to host: null
# (not mapped) because Technitium has no first-run environment variable for
# these -- turning the protocol on and supplying its TLS certificate is done
# afterward in Technitium's own web console (see docs/operations.md,
# "Enabling encrypted DNS for clients"). Mapping the container port here
# only makes the LAN-facing side available once that in-app step is done;
# it does nothing on its own. See docs/decisions.md for why these default to
# off rather than on.
#
# 5382/tcp is the read-only monitoring API listener (added 2026-10-10, see
# docs/decisions.md, "Read-only monitoring API on a second listener"). It is
# NOT the web console: nginx serves only three exact read-only API paths on
# it (dashboard stats, update check, session info) and answers 403 to every
# other path, and Technitium's own user token is still required on each
# call. It exists so Observe (or another LAN monitor) can poll Technitium
# without a Home Assistant Ingress session, which a monitor cannot hold.
# Off by default (host: null); the operator maps it, typically to host port
# 5380, to turn it on. The console port 5380 itself stays Ingress-only and
# is still never listed here. Mappings under ports: are not scored by the
# apps security rating; see docs/security.md for the LAN exposure once
# mapped and the firewall recommendation.
ports:
  53/tcp: 53
  53/udp: 53
  853/tcp: null
  443/tcp: null
  443/udp: null
  5382/tcp: null
ports_description:
  53/tcp: "DNS over TCP (standard port 53). Always needed for this server to act as a resolver."
  53/udp: "DNS over UDP (standard port 53). Always needed for this server to act as a resolver."
  853/tcp: "DNS-over-TLS (DoT), standard port 853. Off (host: null) until enabled with a certificate in Technitium's own web console; see docs/operations.md."
  443/tcp: "DNS-over-HTTPS (DoH), standard port 443. Off (host: null) until enabled with a certificate in Technitium's own web console; see docs/operations.md."
  443/udp: "DNS-over-QUIC (DoQ), standard port 443. Off (host: null) until enabled with a certificate in Technitium's own web console; see docs/operations.md."
  5382/tcp: "Read-only monitoring API for Observe or similar tools. Off (host: null) by default; map it (typically to host port 5380) to turn it on. Serves only an allow-list of read-only Technitium API paths (dashboard stats, update check, session info); every other path answers 403, including login, token creation, settings, zones, and the console pages. Technitium's own user token is still required on every call, so create a dedicated Technitium user with only Dashboard: View and a token for it. The web console itself stays Ingress-only and is never served on this port. See docs/operations.md, 'Monitoring API port for Observe or other tools'."

# Web console is Ingress-only; see docs/decisions.md and docs/security.md.
ingress: true
ingress_port: 5380
panel_icon: mdi:dns
panel_title: "Technitium DNS"

# Explicit device/API grants stay unset: no hassio_api, no homeassistant_api,
# no docker_api, no full_access, no privileged capabilities. Do NOT set
# apparmor: false.

map:
  - data:rw

options:
  dns_server_domain: ""
  admin_password: ""
  prefer_ipv6: false
  recursion: "AllowOnlyForPrivateNetworks"
  recursion_network_acl: ""
  enable_blocking: false
  block_list_urls: ""
  forwarders: ""
  forwarder_protocol: "Udp"
  log_max_log_file_days: 7
  # Unlike every option above, this one is NOT first-run-only: run.sh
  # reads it and regenerates the logrotate config on every start, so
  # changing it and restarting the app takes effect immediately. See
  # docs/operations.md.
  web_console_access_log_retention_days: 90

schema:
  dns_server_domain: str?
  # See docs/security.md: this is used only to seed a first-run password
  # file, never stored back into config.yaml plaintext by this app. Leave
  # blank to let the app generate a random password on first start.
  admin_password: password?
  prefer_ipv6: bool
  recursion: list(Allow|Deny|AllowOnlyForPrivateNetworks|UseSpecifiedNetworkACL)
  recursion_network_acl: str?
  enable_blocking: bool
  block_list_urls: str?
  forwarders: str?
  forwarder_protocol: list(Udp|Tcp|Tls|Https|HttpsJson)
  log_max_log_file_days: int(1,365)
  web_console_access_log_retention_days: int(1,3650)
